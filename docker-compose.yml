version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: captcha_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-teamtrongng}
      MYSQL_USER: ${DB_USER:-teamtrongng}
      MYSQL_PASSWORD: ${DB_PASSWORD:-teamtrongng12@}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - captcha_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: captcha_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-2053}:2053"
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-teamtrongng}
      DB_USER: ${DB_USER:-teamtrongng}
      DB_PASSWORD: ${DB_PASSWORD:-teamtrongng12@}
    volumes:
      - ./app/modules/temp_files:/app/app/modules/temp_files
      - ./stores:/app/stores
      - ./.env:/app/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - captcha_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2053/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
    driver: local

networks:
  captcha_network:
    driver: bridge
