<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuckyNG Admin — API Keys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #2d3a4f;
      --text: #e8eef7;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
    .muted { color: var(--muted); font-size: 0.875rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-top: 20px;
    }
    .login-card { max-width: 400px; margin: 80px auto 0; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font: inherit;
      margin-bottom: 14px;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px; border: none; border-radius: 8px; font: inherit; font-weight: 600;
      cursor: pointer; transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
    .btn-danger { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .tabs { display: flex; gap: 8px; margin-top: 20px; }
    .tab {
      padding: 8px 16px; border-radius: 8px; border: 1px solid transparent;
      background: transparent; color: var(--muted); cursor: pointer; font: inherit; font-weight: 500;
    }
    .tab.active { background: var(--surface2); color: var(--text); border-color: var(--border); }
    .panel { display: none; }
    .panel.active { display: block; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; margin-top: 12px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
    }
    .badge-on { background: rgba(34,197,94,0.15); color: #86efac; }
    .badge-off { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .key-cell { font-family ui-monospace, monospace; font-size: 0.75rem; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .toast {
      position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 100; animation: fadeIn 0.2s;
    }
    .toast.error { border-color: var(--danger); color: #fca5a5; }
    .toast.success { border-color: var(--success); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
    .usage-bar {
      height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 4px; max-width: 120px;
    }
    .usage-bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
    .usage-bar.warn span { background: var(--warn); }
    .usage-bar.full span { background: var(--danger); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 8px; }
    .filter-row > div { flex: 1; min-width: 140px; }
    .filter-row label { margin-bottom: 4px; }
    .filter-row input { margin-bottom: 0; }
    .empty { text-align: center; padding: 32px; color: var(--muted); }
    .new-key-banner {
      margin-top: 16px; padding: 14px; border-radius: 8px;
      background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.35);
    }
    .new-key-banner code { word-break: break-all; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="loginView" class="wrap">
    <div class="card login-card">
      <h1>Admin</h1>
      <p class="muted" style="margin-top:8px">Đăng nhập để quản lý API key và thống kê</p>
      <form id="loginForm" style="margin-top:24px">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required placeholder="admin@example.com">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary" style="width:100%">Đăng nhập</button>
      </form>
    </div>
  </div>

  <div id="appView" class="wrap" hidden>
    <div class="header">
      <div>
        <h1>Quản lý API Key</h1>
        <p class="muted" id="adminName"></p>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Đăng xuất</button>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="keys">API Keys</button>
      <button type="button" class="tab" data-tab="stats">Thống kê theo user</button>
    </div>

    <div id="panelKeys" class="panel active">
      <div class="card">
        <h2>Tạo API key mới</h2>
        <div class="grid-2">
          <div>
            <label for="userSearch">Tìm user (email / tên)</label>
            <input id="userSearch" type="search" placeholder="Gõ ít nhất 3 ký tự...">
          </div>
          <div>
            <label for="userSelect">Chọn user</label>
            <select id="userSelect"><option value="">— Chọn user —</option></select>
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label for="keyLabel">Nhãn (tuỳ chọn)</label>
            <input id="keyLabel" type="text" placeholder="VD: App mobile KH A">
          </div>
          <div>
            <label for="dailyLimit">Giới hạn yêu cầu / ngày</label>
            <input id="dailyLimit" type="number" min="1" value="1000">
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="createKeyBtn">Tạo API key</button>
        <div id="newKeyBanner" class="new-key-banner" hidden>
          <strong>Key mới — sao chép ngay:</strong>
          <p style="margin-top:8px"><code id="newKeyValue"></code></p>
          <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px" id="copyNewKey">Sao chép</button>
        </div>
      </div>

      <div class="card">
        <h2>Danh sách API key</h2>
        <div id="keysTableWrap"></div>
      </div>
    </div>

    <div id="panelStats" class="panel">
      <div class="card">
        <h2>Yêu cầu theo user / ngày</h2>
        <p class="muted">Thống kê khi client gọi API Veo bằng header <code>x-api-key</code> (múi giờ Việt Nam).</p>
        <div class="filter-row" style="margin-top:16px">
          <div>
            <label for="statFrom">Từ ngày</label>
            <input id="statFrom" type="date">
          </div>
          <div>
            <label for="statTo">Đến ngày</label>
            <input id="statTo" type="date">
          </div>
          <div>
            <button type="button" class="btn btn-primary" id="loadStatsBtn">Tải thống kê</button>
          </div>
        </div>
        <div id="statsTableWrap"></div>
      </div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "luckyng_admin_token";
    const USER_KEY = "luckyng_admin_user";

    function todayLocal() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }

    function toast(msg, type = "success") {
      const el = document.createElement("div");
      el.className = "toast " + (type === "error" ? "error" : "success");
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      const token = getToken();
      if (token) headers.Authorization = "Bearer " + token;
      const res = await fetch(path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.message || data.error || "Request failed");
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function showLogin() {
      document.getElementById("loginView").hidden = false;
      document.getElementById("appView").hidden = true;
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
    }

    function showApp(user) {
      document.getElementById("loginView").hidden = true;
      document.getElementById("appView").hidden = false;
      document.getElementById("adminName").textContent = user.name + " · " + user.email;
      document.getElementById("statFrom").value = todayLocal();
      document.getElementById("statTo").value = todayLocal();
      loadKeys();
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        if (!res.success || !res.data?.token) throw new Error("Đăng nhập thất bại");
        if (res.data.role !== 1) {
          toast("Chỉ tài khoản admin (role 1) được truy cập", "error");
          return;
        }
        localStorage.setItem(TOKEN_KEY, res.data.token);
        const profile = { name: res.data.name || email, email: email };
        localStorage.setItem(USER_KEY, JSON.stringify(profile));
        showApp(profile);
        toast("Đăng nhập thành công");
      } catch (err) {
        toast(err.message || "Sai email hoặc mật khẩu", "error");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", showLogin);

    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel" + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.add("active");
        if (btn.dataset.tab === "stats") loadStats();
      });
    });

    let searchTimer;
    document.getElementById("userSearch").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadUsers, 400);
    });

    async function loadUsers() {
      const q = document.getElementById("userSearch").value.trim();
      const sel = document.getElementById("userSelect");
      if (q.length < 3) return;
      try {
        const res = await api("/api/users?limit=30&search=" + encodeURIComponent(q));
        const rows = res.data || [];
        sel.innerHTML = '<option value="">— Chọn user —</option>';
        rows.forEach((u) => {
          const opt = document.createElement("option");
          opt.value = u.id;
          opt.textContent = `${u.name || "—"} · ${u.email} (id: ${u.id})`;
          sel.appendChild(opt);
        });
      } catch (err) {
        toast(err.message, "error");
      }
    }

    function usageClass(used, limit) {
      const p = used / limit;
      if (p >= 1) return "full";
      if (p >= 0.8) return "warn";
      return "";
    }

    async function loadKeys() {
      const wrap = document.getElementById("keysTableWrap");
      wrap.innerHTML = '<p class="muted">Đang tải...</p>';
      try {
        const res = await api("/api/admin/api-keys");
        const rows = res.data || [];
        if (!rows.length) {
          wrap.innerHTML = '<div class="empty">Chưa có API key nào</div>';
          return;
        }
        let html = `<table><thead><tr>
          <th>User</th><th>Nhãn</th><th>Key</th><th>Hôm nay</th><th>Giới hạn/ngày</th><th>Trạng thái</th><th></th>
        </tr></thead><tbody>`;
        rows.forEach((k) => {
          const pct = Math.min(100, (k.todayUsage / k.dailyLimit) * 100);
          html += `<tr>
            <td>${escapeHtml(k.owner?.name || "—")}<br><span class="muted">${escapeHtml(k.owner?.email || "")}</span></td>
            <td>${escapeHtml(k.label || "—")}</td>
            <td class="key-cell" title="${escapeHtml(k.keyValue)}">${escapeHtml(k.keyValue)}</td>
            <td>
              ${k.todayUsage} / ${k.dailyLimit}
              <div class="usage-bar ${usageClass(k.todayUsage, k.dailyLimit)}"><span style="width:${pct}%"></span></div>
            </td>
            <td><input type="number" min="1" value="${k.dailyLimit}" data-limit-id="${k.id}" style="margin:0;width:90px"></td>
            <td><span class="badge ${k.status === 1 ? "badge-on" : "badge-off"}">${k.status === 1 ? "Bật" : "Tắt"}</span></td>
            <td class="actions">
              <button class="btn btn-ghost btn-sm" data-copy="${escapeHtml(k.keyValue)}">Copy</button>
              <button class="btn btn-ghost btn-sm" data-save-limit="${k.id}">Lưu limit</button>
              <button class="btn btn-ghost btn-sm" data-toggle="${k.id}" data-status="${k.status}">${k.status === 1 ? "Tắt" : "Bật"}</button>
              <button class="btn btn-danger btn-sm" data-del="${k.id}">Xóa</button>
            </td>
          </tr>`;
        });
        html += "</tbody></table>";
        wrap.innerHTML = html;

        wrap.querySelectorAll("[data-copy]").forEach((btn) => {
          btn.addEventListener("click", () => copyText(btn.getAttribute("data-copy")));
        });
        wrap.querySelectorAll("[data-save-limit]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-save-limit");
            const input = wrap.querySelector(`[data-limit-id="${id}"]`);
            try {
              await api("/api/admin/api-keys/" + id, {
                method: "PATCH",
                body: JSON.stringify({ dailyLimit: parseInt(input.value, 10) }),
              });
              toast("Đã cập nhật giới hạn");
              loadKeys();
            } catch (err) {
              toast(err.message, "error");
            }
          });
        });
        wrap.querySelectorAll("[data-toggle]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-toggle");
            const cur = parseInt(btn.getAttribute("data-status"), 10);
            const next = cur === 1 ? 2 : 1;
            try {
              await api("/api/admin/api-keys/" + id, {
                method: "PATCH",
                body: JSON.stringify({ status: next }),
              });
              loadKeys();
            } catch (err) {
              toast(err.message, "error");
            }
          });
        });
        wrap.querySelectorAll("[data-del]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("Xóa API key này?")) return;
            try {
              await api("/api/admin/api-keys/" + btn.getAttribute("data-del"), { method: "DELETE" });
              toast("Đã xóa");
              loadKeys();
            } catch (err) {
              toast(err.message, "error");
            }
          });
        });
      } catch (err) {
        wrap.innerHTML = '<div class="empty">' + escapeHtml(err.message) + "</div>";
        if (err.status === 401) showLogin();
      }
    }

    document.getElementById("createKeyBtn").addEventListener("click", async () => {
      const userId = document.getElementById("userSelect").value;
      const label = document.getElementById("keyLabel").value.trim();
      const dailyLimit = document.getElementById("dailyLimit").value;
      if (!userId) {
        toast("Chọn user trước khi tạo key", "error");
        return;
      }
      try {
        const res = await api("/api/admin/api-keys", {
          method: "POST",
          body: JSON.stringify({ userId, label, dailyLimit }),
        });
        document.getElementById("newKeyValue").textContent = res.data.keyValue;
        document.getElementById("newKeyBanner").hidden = false;
        toast("Tạo API key thành công");
        loadKeys();
      } catch (err) {
        toast(err.message, "error");
      }
    });

    document.getElementById("copyNewKey").addEventListener("click", () => {
      copyText(document.getElementById("newKeyValue").textContent);
    });

    async function loadStats() {
      const wrap = document.getElementById("statsTableWrap");
      const from = document.getElementById("statFrom").value;
      const to = document.getElementById("statTo").value;
      wrap.innerHTML = '<p class="muted">Đang tải...</p>';
      try {
        const q = new URLSearchParams({ from, to });
        const res = await api("/api/admin/stats/by-user?" + q);
        const rows = res.data || [];
        if (!rows.length) {
          wrap.innerHTML = '<div class="empty">Không có dữ liệu trong khoảng ngày đã chọn</div>';
          return;
        }
        let html = `<table><thead><tr><th>Ngày</th><th>User</th><th>Email</th><th>Số yêu cầu</th></tr></thead><tbody>`;
        rows.forEach((r) => {
          html += `<tr>
            <td>${escapeHtml(r.statDate)}</td>
            <td>${escapeHtml(r.user?.name || "—")}</td>
            <td>${escapeHtml(r.user?.email || "—")}</td>
            <td><strong>${r.requestCount}</strong></td>
          </tr>`;
        });
        html += "</tbody></table>";
        wrap.innerHTML = html;
      } catch (err) {
        wrap.innerHTML = '<div class="empty">' + escapeHtml(err.message) + "</div>";
      }
    }

    document.getElementById("loadStatsBtn").addEventListener("click", loadStats);

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => toast("Đã sao chép")).catch(() => toast("Không sao chép được", "error"));
    }

    function escapeHtml(s) {
      if (!s) return "";
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    }

    (async function init() {
      const token = getToken();
      const userRaw = localStorage.getItem(USER_KEY);
      if (token && userRaw) {
        try {
          await api("/api/auth/verifyToken");
          showApp(JSON.parse(userRaw));
        } catch {
          showLogin();
        }
      }
    })();
  </script>
</body>
</html>
